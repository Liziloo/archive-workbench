[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "archive-workbench"
version = "0.1.0"
description = "A workbench for processing archival materials for preservation and publication."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0,<1",
    "python-multipart>=0.0.9",
]

[dependency-groups]
dev = [
    "httpx>=0.27.0",
    "httpx2>=0.3.0",
    "pytest>=9.1.1",
]

[tool.hatch.build.targets.wheel]
packages = ["archive_workbench"]